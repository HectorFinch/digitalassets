<html lang="en">
<head>
<meta charset="utf-8">

<title>Your Week</title>
<style>
:root { color-scheme: light; --ink:#181816; --paper:#f4f2ec; --panel:#fffefa; --line:#ddd8cc; --muted:#62615e; }
* { box-sizing: border-box; }
body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--paper); color:var(--ink); font-family:"Gill Sans","Gill Sans MT",Calibri,Arial,sans-serif; }
main { width:min(420px, calc(100vw - 28px)); background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:22px; box-shadow:0 10px 30px rgba(40,34,24,.08); }
h1 { margin:0 0 8px; font-size:34px; line-height:.96; text-transform:uppercase; }
p { color:var(--muted); line-height:1.4; }
label { display:grid; gap:7px; margin-top:16px; font-weight:700; }
input { width:100%; border:1px solid #c9c0ad; border-radius:9px; padding:12px; font:inherit; background:#fff; }
button { margin-top:12px; width:100%; border:0; border-radius:9px; padding:12px; background:var(--ink); color:#fff; font:inherit; font-weight:700; }
.status { min-height:22px; margin:12px 0 0; }
.small { font-size:13px; }
</style>
</head>
<body>
<main>
  <h1>Your Week</h1>
  <p>Enter the password to open Oliver's read-only phone view.</p>

    <label>Password

    </label>
    <button type="submit">Open</button>
    <p class="status" id="status" aria-live="polite"></p>
  </form>
  <p class="small">If this looks out of date, ask Codex to refresh and republish the phone view.</p>
</main>

const statusEl = document.getElementById("status");
const PASSWORD_STORE_KEY = "codexPaPhoneWeekPassword";
const LOCK_SCOPE = PAYLOAD.lock_id || "default";
const LOCK_STORE_KEY = "codexPaPhoneWeekLocked:" + LOCK_SCOPE;
const FAIL_STORE_KEY = "codexPaPhoneWeekFails:" + LOCK_SCOPE;
const MAX_ATTEMPTS = Math.max(1, Number(PAYLOAD.max_attempts || 4));
const formEl = document.getElementById("unlock");
const passwordEl = document.getElementById("password");
const submitButton = formEl.querySelector("button");

function bytesFromBase64(value) {
  return Uint8Array.from(atob(value), c => c.charCodeAt(0));
}

async function decrypt(password) {
  const enc = new TextEncoder();
  const baseKey = await crypto.subtle.importKey("raw", enc.encode(password), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: bytesFromBase64(PAYLOAD.salt), iterations: PAYLOAD.iterations, hash: "SHA-256" },
    baseKey,
    { name: "AES-GCM", length: 256 },
    false,
    ["decrypt"]
  );
  const compressed = await crypto.subtle.decrypt(
    { name: "AES-GCM", iv: bytesFromBase64(PAYLOAD.iv) },
    key,
    bytesFromBase64(PAYLOAD.ciphertext)
  );
  if (!("DecompressionStream" in window)) {
    throw new Error("This browser cannot decompress the phone view.");
  }
  const stream = new Blob([compressed]).stream().pipeThrough(new DecompressionStream("gzip"));
  const plaintext = await new Response(stream).arrayBuffer();
  return new TextDecoder().decode(plaintext);
}

function storedPassword() {
  try { return sessionStorage.getItem(PASSWORD_STORE_KEY) || ""; }
  catch { return ""; }
}

function rememberPassword(password) {
  try { sessionStorage.setItem(PASSWORD_STORE_KEY, password); }
  catch {}
}

function forgetPassword() {
  try { sessionStorage.removeItem(PASSWORD_STORE_KEY); }
  catch {}
}

function storageGet(key) {
  try { return localStorage.getItem(key) || ""; }
  catch { return ""; }
}

function storageSet(key, value) {
  try { localStorage.setItem(key, value); }
  catch {}
}

function storageRemove(key) {
  try { localStorage.removeItem(key); }
  catch {}
}

function failedAttempts() {
  return Math.max(0, Number(storageGet(FAIL_STORE_KEY) || 0));
}

function clearFailedAttempts() {
  storageRemove(FAIL_STORE_KEY);
  storageRemove(LOCK_STORE_KEY);
}

function isLocked() {
  return storageGet(LOCK_STORE_KEY) === "1";
}

function showLocked() {
  statusEl.textContent = "Locked after too many wrong tries. Ask Codex PA to unlock and republish it.";
  passwordEl.disabled = true;
  submitButton.disabled = true;
}

function recordFailure() {
  const next = failedAttempts() + 1;
  storageSet(FAIL_STORE_KEY, String(next));
  if (next >= MAX_ATTEMPTS) {
    storageSet(LOCK_STORE_KEY, "1");
    forgetPassword();
    showLocked();
    return;
  }
  const left = MAX_ATTEMPTS - next;
  statusEl.textContent = "Password did not unlock it. " + left + " " + (left === 1 ? "try" : "tries") + " left.";
}

async function openWithPassword(password, remember, countFailure) {
  if (isLocked()) {
    showLocked();
    return;
  }
  statusEl.textContent = "Opening...";
  try {
    const html = await decrypt(password);
    clearFailedAttempts();
    if (remember) rememberPassword(password);
    document.open();
    document.write(html);
    document.close();
  } catch {
    forgetPassword();
    if (countFailure) recordFailure();
    else statusEl.textContent = "Saved password no longer works. Please enter the current one.";
  }
}

document.getElementById("unlock").addEventListener("submit", async event => {
  event.preventDefault();
  await openWithPassword(passwordEl.value, true, true);
});

const savedPassword = storedPassword();
if (isLocked()) {
  showLocked();
} else if (savedPassword) {
  passwordEl.value = savedPassword;
  openWithPassword(savedPassword, false, false);
}
